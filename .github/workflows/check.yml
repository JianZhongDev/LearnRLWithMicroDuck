name: check

on:
  push:
  pull_request:

jobs:
  repo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository self-check (skills, links, paths, line endings)
        run: python tools/check_repo.py
      - name: Shell syntax
        run: bash -n setup.sh && bash -n lab.sh
